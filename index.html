<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Share</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f0f2f5;
      padding: 20px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.1);
      padding: 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.5rem;
      color: #1a1a2e;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #666;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }

    .image-container {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 24px;
      background: #e9ecef;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .image-container img {
      width: 100%;
      display: block;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #ddd;
      border-top-color: #4361ee;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      position: absolute;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .share-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #4361ee;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
      justify-content: center;
    }

    .share-btn:hover { background: #3a56d4; }
    .share-btn:active { transform: scale(0.98); }
    .share-btn:disabled {
      background: #adb5bd;
      cursor: not-allowed;
      transform: none;
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #25d366;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      width: 100%;
      justify-content: center;
    }

    .whatsapp-btn:hover { background: #1ebe57; }
    .whatsapp-btn:active { transform: scale(0.98); }
    .whatsapp-btn:disabled {
      background: #adb5bd;
      cursor: not-allowed;
      transform: none;
    }

    .wa-hint {
      font-size: 0.78rem;
      color: #888;
      margin-top: -4px;
      display: none;
    }

    .status {
      margin-top: 16px;
      font-size: 0.85rem;
      color: #666;
      min-height: 1.2em;
    }

    .status.error { color: #e63946; }
    .status.success { color: #2d6a4f; }

    .fallback-links {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 16px;
      flex-wrap: wrap;
    }

    .fallback-links a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      color: #fff;
      transition: opacity 0.2s;
    }

    .fallback-links a:hover { opacity: 0.85; }
    .fallback-links .twitter { background: #1da1f2; }
    .fallback-links .whatsapp { background: #25d366; }
    .fallback-links .download { background: #6c757d; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Web Share API Demo</h1>
    <p class="subtitle">Share an image using the native share dialog</p>

    <div class="image-container">
      <div class="spinner" id="spinner"></div>
      <img id="preview" alt="Random demo image" style="display:none">
    </div>

    <div class="btn-group">
      <button class="share-btn" id="shareBtn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
          <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
        </svg>
        Share Image
      </button>

      <button class="whatsapp-btn" id="whatsappBtn" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
        </svg>
        Share to WhatsApp Status
      </button>
      <p class="wa-hint" id="waHint">Tip: Select "My Status" in WhatsApp to post as a Status update</p>
    </div>

    <div class="status" id="status"></div>
    <div class="fallback-links" id="fallback" style="display:none">
      <a class="download" id="downloadLink" download="shared-image.jpg">Download</a>
    </div>
  </div>

  <script>
    const IMAGE_URL = 'https://picsum.photos/seed/share-demo/400/300';

    const img = document.getElementById('preview');
    const btn = document.getElementById('shareBtn');
    const waBtn = document.getElementById('whatsappBtn');
    const waHint = document.getElementById('waHint');
    const statusEl = document.getElementById('status');
    const spinner = document.getElementById('spinner');
    const fallbackEl = document.getElementById('fallback');
    const downloadLink = document.getElementById('downloadLink');

    let imageFile = null;

    // Fetch the image as a real blob — avoids canvas CORS tainting entirely.
    async function loadImage() {
      try {
        const resp = await fetch(IMAGE_URL);
        if (!resp.ok) throw new Error('HTTP ' + resp.status);

        const blob = await resp.blob();

        // Ensure we have a proper JPEG File object (not an opaque blob)
        const jpegBlob = blob.type.startsWith('image/')
          ? blob
          : new Blob([blob], { type: 'image/jpeg' });

        imageFile = new File([jpegBlob], 'shared-image.jpg', {
          type: jpegBlob.type,
          lastModified: Date.now(),
        });

        // Show preview from the object URL (no CORS needed)
        const objectUrl = URL.createObjectURL(jpegBlob);
        img.src = objectUrl;
        img.onload = () => {
          spinner.style.display = 'none';
          img.style.display = 'block';
        };

        // Set up download fallback
        downloadLink.href = objectUrl;

        btn.disabled = false;
        waBtn.disabled = false;
        setStatus('Image loaded — ready to share!', 'success');
      } catch (err) {
        spinner.style.display = 'none';
        setStatus('Failed to load image: ' + err.message, 'error');
        fallbackEl.style.display = 'flex';
      }
    }

    loadImage();

    // ── Generic share (native share sheet) ──
    btn.addEventListener('click', async () => {
      if (!imageFile) return;

      if (navigator.canShare && navigator.canShare({ files: [imageFile] })) {
        try {
          await navigator.share({
            title: 'Check out this image!',
            text: 'Shared via Web Share API Demo',
            files: [imageFile],
          });
          setStatus('Shared successfully!', 'success');
        } catch (err) {
          if (err.name === 'AbortError') {
            setStatus('Share cancelled.', '');
          } else {
            setStatus('Share failed: ' + err.message, 'error');
            showFallback();
          }
        }
      } else if (navigator.share) {
        try {
          await navigator.share({
            title: 'Check out this image!',
            text: 'Shared via Web Share API Demo',
            url: window.location.href,
          });
          setStatus('Shared link (file sharing not supported).', 'success');
        } catch (err) {
          if (err.name !== 'AbortError') {
            setStatus('Share failed.', 'error');
            showFallback();
          }
        }
      } else {
        setStatus('Web Share API not supported on this browser.', 'error');
        showFallback();
      }
    });

    // ── WhatsApp Status share ──
    // Strategy:
    //   1. navigator.share({ files }) — opens the OS share sheet; user picks
    //      WhatsApp and can select "My Status" to post the image as a Status.
    //      This is the ONLY reliable way to share an image to WA Status from
    //      the web — WhatsApp has no direct deep-link for Status-with-image.
    //   2. Fallback (desktop / unsupported): open whatsapp:// deep-link which
    //      at least launches the app, and show instructions.
    waBtn.addEventListener('click', async () => {
      if (!imageFile) return;

      if (navigator.canShare && navigator.canShare({ files: [imageFile] })) {
        waHint.style.display = 'block';
        try {
          await navigator.share({
            files: [imageFile],
          });
          setStatus('Image shared — check WhatsApp Status!', 'success');
          waHint.style.display = 'none';
        } catch (err) {
          waHint.style.display = 'none';
          if (err.name === 'AbortError') {
            setStatus('Share cancelled.', '');
          } else {
            setStatus('Share sheet failed — opening WhatsApp...', 'error');
            openWhatsAppDeepLink();
          }
        }
      } else {
        // No file-share support — try deep link
        openWhatsAppDeepLink();
      }
    });

    function openWhatsAppDeepLink() {
      // Try the whatsapp:// scheme first (works on mobile if WA is installed).
      // Falls back to web.whatsapp.com with a text prompt.
      const text = encodeURIComponent(
        'Check out this image!\n' + window.location.href
      );

      const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

      if (isMobile) {
        // On Android, intent:// can launch WhatsApp directly
        const isAndroid = /Android/i.test(navigator.userAgent);
        if (isAndroid) {
          // Android intent to send image via WhatsApp
          // Since we can't pass blob via intent from browser, open WA with text
          window.location.href =
            'intent://send?text=' + text +
            '#Intent;scheme=whatsapp;package=com.whatsapp;end';
        } else {
          // iOS — whatsapp:// scheme
          window.location.href = 'whatsapp://send?text=' + text;
        }
        setStatus(
          'WhatsApp opened — to post as Status: save the image above (long-press), then add it from WhatsApp Status.',
          'success'
        );
      } else {
        // Desktop fallback
        window.open('https://web.whatsapp.com/', '_blank');
        setStatus(
          'WhatsApp Web opened — save the image (right-click > Save), then post as Status from your phone.',
          'success'
        );
      }

      showFallback();
    }

    function showFallback() {
      fallbackEl.style.display = 'flex';
    }

    function setStatus(msg, type) {
      statusEl.textContent = msg;
      statusEl.className = 'status' + (type ? ' ' + type : '');
    }
  </script>
</body>
</html>
